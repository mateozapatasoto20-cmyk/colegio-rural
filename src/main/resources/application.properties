spring.application.name=colegio-rural
server.port=8080

# Base de datos activa: mysql (XAMPP) o postgres. Cambiar SOLO esta línea cambia de motor.
spring.profiles.active=mysql

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=60m
server.error.whitelabel.enabled=true

# Reglas por defecto (luego se editan en la pantalla "Reglas del sistema" y se guardan en la BD)
colegio.por-pagina=8
colegio.periodo=2026-I
colegio.grados=5to Primaria,6to Primaria,1ro Secundaria,2do Secundaria,3ro Secundaria,4to Secundaria,5to Secundaria
colegio.secciones=A,B,C
colegio.nota-minima=11
colegio.asistencia-minima=65
colegio.faltas-seguidas=3
